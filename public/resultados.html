<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071018" />
    <title>Resultados · Brief Mercadotecnia YAAVS</title>
    <link rel="icon" href="./favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./resultados.css" />
  </head>
  <body>
    <div class="scene-bg" aria-hidden="true">
      <div class="scene-photo"></div>
      <div class="scene-overlay"></div>
    </div>

    <header class="topbar">
      <div class="brand-block">
        <img src="./assets/logo-yaavs-white.png" alt="YAAVS" width="220" height="77" class="brand-logo" />
        <div>
          <h1>Resultados del brief</h1>
          <p class="live-line">
            <span class="live-dot" aria-hidden="true"></span>
            <span id="liveStatus">Conectando…</span>
          </p>
        </div>
      </div>
      <div class="top-actions">
        <a class="ghost-link" href="./api/export.csv">Exportar CSV</a>
        <a class="ghost-link" href="./">Formulario</a>
      </div>
    </header>

    <main class="layout">
      <section class="kpis" id="kpis"></section>
      <section class="split">
        <article class="card detail-card" id="detailCard">
          <p class="muted">Cargando solicitudes…</p>
        </article>
        <aside class="card stats-card" id="statsCard"></aside>
      </section>
    </main>

    <script src="./resultados.js" defer></script>
  </body>
</html>
