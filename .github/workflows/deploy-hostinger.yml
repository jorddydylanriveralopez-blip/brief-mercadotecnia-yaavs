name: Deploy to Hostinger

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack source archive
        run: |
          STAMP=$(date -u +%Y%m%d_%H%M%S)
          ARCHIVE="brief-mercadotecnia-yaavs_${STAMP}.zip"
          zip -r "$ARCHIVE" . \
            -x "node_modules/*" \
            -x ".git/*" \
            -x "data/responses.json" \
            -x ".env" \
            -x ".env.*" \
            -x ".DS_Store" \
            -x "*.zip" \
            -x ".github/*"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          ls -lh "$ARCHIVE"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install upload deps
        run: npm install --no-save axios tus-js-client

      - name: Upload archive and trigger Node build
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_DOMAIN: ${{ secrets.HOSTINGER_DOMAIN }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const axios = require('axios');
          const tus = require('tus-js-client');

          const TOKEN = process.env.HOSTINGER_API_TOKEN;
          const USERNAME = process.env.HOSTINGER_USERNAME || 'u376360150';
          const DOMAIN = process.env.HOSTINGER_DOMAIN || 'grey-ram-535914.hostingersite.com';
          const ARCHIVE = process.env.ARCHIVE;
          const BASE = 'https://developers.hostinger.com';
          const headers = {
            Authorization: `Bearer ${TOKEN}`,
            Accept: 'application/json',
            'User-Agent': 'github-actions-hostinger-deploy/1.0',
          };

          function sleep(ms) {
            return new Promise((r) => setTimeout(r, ms));
          }

          async function uploadFile(filePath, relativePath, uploadUrl, authRestToken, authToken) {
            const stats = fs.statSync(filePath);
            const cleanUploadUrl = uploadUrl.replace(/\/$/, '');
            const uploadUrlWithFile = `${cleanUploadUrl}/${relativePath.replace(/^\/+/, '')}?override=true`;
            const requestHeaders = {
              'X-Auth': authToken,
              'X-Auth-Rest': authRestToken,
              'upload-length': String(stats.size),
              'upload-offset': '0',
            };

            await axios.post(uploadUrlWithFile, '', {
              headers: requestHeaders,
              timeout: 60000,
              validateStatus: (s) => s === 201,
            });

            await new Promise((resolve, reject) => {
              const upload = new tus.Upload(fs.createReadStream(filePath), {
                uploadUrl: uploadUrlWithFile,
                retryDelays: [1000, 2000, 4000, 8000],
                uploadDataDuringCreation: false,
                parallelUploads: 1,
                chunkSize: 10485760,
                headers: requestHeaders,
                removeFingerprintOnSuccess: true,
                uploadSize: stats.size,
                metadata: { filename: path.basename(relativePath) },
                onError: (error) => reject(error),
                onProgress: (sent, total) => console.log(`progress ${sent}/${total}`),
                onSuccess: () => resolve(),
              });
              upload.start();
            });
          }

          (async () => {
            if (!TOKEN) throw new Error('HOSTINGER_API_TOKEN missing');
            if (!ARCHIVE || !fs.existsSync(ARCHIVE)) throw new Error('ARCHIVE missing');

            console.log('domain', DOMAIN, 'user', USERNAME, 'archive', ARCHIVE);

            const creds = (
              await axios.post(
                `${BASE}/api/hosting/v1/files/upload-urls`,
                { username: USERNAME, domain: DOMAIN },
                { headers: { ...headers, 'Content-Type': 'application/json' } }
              )
            ).data;
            console.log('upload url', creds.url);

            await uploadFile(ARCHIVE, path.basename(ARCHIVE), creds.url, creds.rest_auth_key, creds.auth_key);
            console.log('upload done');

            let settings = {
              node_version: 22,
              app_type: 'express',
              entry_file: 'server.js',
              package_manager: 'npm',
              build_script: 'build',
            };
            try {
              const settingsUrl = `${BASE}/api/hosting/v1/accounts/${USERNAME}/websites/${DOMAIN}/nodejs/builds/settings/from-archive?archive_path=${encodeURIComponent(path.basename(ARCHIVE))}`;
              settings = (await axios.get(settingsUrl, { headers })).data;
              console.log('settings', JSON.stringify(settings));
            } catch (e) {
              console.log('settings fallback', e.response?.status || e.message);
            }

            const buildBody = {
              ...settings,
              node_version: 22,
              app_type: 'express',
              entry_file: 'server.js',
              package_manager: 'npm',
              source_type: 'archive',
              source_options: { archive_path: path.basename(ARCHIVE) },
            };
            const build = (
              await axios.post(
                `${BASE}/api/hosting/v1/accounts/${USERNAME}/websites/${DOMAIN}/nodejs/builds`,
                buildBody,
                { headers: { ...headers, 'Content-Type': 'application/json' } }
              )
            ).data;
            console.log('build', JSON.stringify(build));

            let uuid = build.uuid;
            for (let i = 0; i < 60; i++) {
              await sleep(5000);
              const list = (
                await axios.get(
                  `${BASE}/api/hosting/v1/accounts/${USERNAME}/websites/${DOMAIN}/nodejs/builds?per_page=5`,
                  { headers }
                )
              ).data;
              const latest = list.data?.[0];
              const state = String(latest?.state || '').toLowerCase();
              uuid = latest?.uuid || uuid;
              console.log(`poll ${i + 1}`, state, uuid);
              if (['completed', 'success', 'succeeded'].includes(state)) {
                console.log('SUCCESS');
                console.log(`LIVE_URL=https://${DOMAIN}/`);
                console.log(`RESULTADOS=https://${DOMAIN}/resultados`);
                process.exit(0);
              }
              if (['failed', 'error'].includes(state)) {
                try {
                  const logs = (
                    await axios.get(
                      `${BASE}/api/hosting/v1/accounts/${USERNAME}/websites/${DOMAIN}/nodejs/builds/${uuid}/logs?from_line=0`,
                      { headers, validateStatus: () => true }
                    )
                  ).data;
                  console.error('LOGS', JSON.stringify(logs).slice(0, 5000));
                } catch (_) {}
                process.exit(1);
              }
            }
            throw new Error('Build timed out');
          })().catch((e) => {
            console.error('DEPLOY_FAILED', e.response?.data || e.message);
            process.exit(1);
          });
          NODE
